# MarineSABRES Demonstration Area Tool - Nginx Configuration
# Location: /etc/nginx/sites-available/default.d-da.conf
# Purpose: Reverse proxy for Flask app deployed at /DA/ subpath
# Backend: Gunicorn on 127.0.0.1:5002

# Static files for DA Tool (CSS, JS, images)
location /DA/static/ {
    alias /home/razinka/OneDrive/HORIZON_EUROPE/Marine-SABRES/DAViewer/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;

    # Handle missing files gracefully
    try_files $uri $uri/ =404;
}

# Logo files
location /DA/logo/ {
    alias /home/razinka/OneDrive/HORIZON_EUROPE/Marine-SABRES/DAViewer/LOGO/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Main DA application backend
location /DA/ {
    # Rewrite rules to handle subpath
    rewrite ^/DA(/.*)$ $1 break;
    rewrite ^/DA$ / break;

    # Proxy to Gunicorn
    proxy_pass http://127.0.0.1:5002;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Critical for Flask subpath deployment - use X-Forwarded-Prefix for ProxyFix
    proxy_set_header X-Forwarded-Prefix /DA;
    proxy_set_header X-Script-Name /DA;

    # Timeout settings for WMS requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Buffer settings for large WMS responses
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Disable request buffering for file uploads
    proxy_request_buffering off;

    # WebSocket support (if needed in future)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Health check endpoint (bypass proxy for efficiency)
location /DA/health {
    proxy_pass http://127.0.0.1:5002/health;
    proxy_set_header Host $host;
    access_log off;
}

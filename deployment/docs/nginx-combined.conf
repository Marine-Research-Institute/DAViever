# ============================================================================
# Nginx configuration for MarineSABRES DA Tool - Combined Dev + Prod
#
# Production: http://laguna.ku.lt/DA/
# Development: http://laguna.ku.lt:5003 (direct port access)
#
# Place this file in: /etc/nginx/sites-available/default.d-marinesabres.conf
# Include in main config: include /etc/nginx/sites-available/default.d-marinesabres.conf;
# ============================================================================

# ============================================================================
# PRODUCTION VERSION - /DA/ subpath
# ============================================================================

# Static files for production - served directly by nginx
location /DA/static/ {
    alias /home/razinka/OneDrive/HORIZON_EUROPE/Marine-SABRES/DAViewer-prod/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Production application - reverse proxy to Gunicorn
location /DA/ {
    # Remove /DA prefix before passing to Flask
    rewrite ^/DA(/.*)$ $1 break;

    # Proxy to production Gunicorn on port 5002
    proxy_pass http://127.0.0.1:5002;

    # Headers for proper routing
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /DA;
    proxy_set_header X-Script-Name /DA;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (if needed)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts - longer for WMS operations
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}


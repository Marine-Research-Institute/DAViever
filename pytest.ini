[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Test discovery patterns
addopts =
    --import-mode=importlib
    --ignore=tests/manual
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=app
    --cov=config
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    # Ratchet: the [tool:pytest] header made pytest ignore this file until
    # 2026-11-20, so 80% was never enforced. Measured 51% when first applied;
    # raise this as coverage improves (target 80).
    --cov-fail-under=50

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    wms: Tests that interact with WMS services
    slow: Tests that take a long time to run
    network: Tests that require network connectivity

# Minimum version requirements
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*imp module.*:DeprecationWarning


# Parallel execution
# addopts = -n auto  # Uncomment to run tests in parallel